<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ciao管理"><title>Copic Ciao 購入管理</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--pink:#d85c7b;--ink:#302a2d;--muted:#82777b;--line:#eee2e6;--bg:#fff8fa;--card:#fff;--green:#27865c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));}

main{max-width:760px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:9px;background:#f0e7ea;border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;background:var(--pink);width:0}
.toolbar{display:grid;gap:9px;margin:14px 0}.search,select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:11px;padding:11px;background:white;color:var(--ink);width:100%;font-size:16px} .filters{display:flex;gap:7px;flex-wrap:wrap}.filters button,.action{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-size:13px;color:var(--ink)}button.active{background:#fce8ee;border-color:#efb9c8;color:#a83f5c}

.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border-radius:10px}.foot{font-size:11px;color:var(--muted);line-height:1.6;margin:15px 3px}.empty{text-align:center;color:var(--muted);padding:24px;grid-column:1/-1}
@media(min-width:560px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main>
<header><h1>COPIC CIAO</h1><p>MY COLOR COLLECTION · 180 COLORS</p></header>
<section class="stats"><div class="stat"><b id="total">180</b><span>登録カラー</span></div><div class="stat"><b id="bought" style="color:var(--green)">0</b><span>購入済み</span></div><div class="stat"><b id="remaining" style="color:var(--pink)">180</b><span>未購入</span></div></section>
<section class="panel" style="margin-top:9px"><div style="display:flex;justify-content:space-between;font-size:13px"><strong>購入進捗</strong><b id="percent">0%</b></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<div class="toolbar"><input id="search" class="search" placeholder="色番号・色名で検索"><div class="filters" id="filters"><button class="active" data-filter="all">すべて</button><button data-filter="todo">未購入</button><button data-filter="done">購入済み</button></div>
<select id="family"><option value="all">すべての色系統</option></select></div>
<div style="display:flex;justify-content:space-between;align-items:center"><h2>カラー一覧</h2><span class="small" id="shown"></span></div><section class="list" id="list"></section>
<section class="panel" style="margin-top:16px"><h2 style="margin:0 0 10px">データ管理</h2><div class="actions"><button class="action" id="export">バックアップを書き出す</button><button class="action" id="importBtn">バックアップを読み込む</button><input id="file" type="file" accept="application/json" hidden></div><p class="foot">購入状況・購入日・価格・店舗メモはこのiPhone内に保存されます。機種変更やブラウザのデータ消去に備えて、定期的にバックアップしてください。</p></section>
<p class="foot">色チップは画面上で色を探すための近似表示です。モニター・印刷・実際のインクの色とは異なります。正確な色は実物の塗り見本で確認してください。カラー名は参考表記です。</p>
</main>

const KEY='copic-ciao-manager-v1';
let records=original.map(x=>({...x,bought:false,date:'',price:'',shop:'',note:''}));
try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)){const map=new Map(saved.map(x=>[x.code,x]));records=records.map(x=>({...x,...(map.get(x.code)||{})}));}}catch(e){}
let filter='all';
const $=id=>document.getElementById(id);
const families=['BV','V','RV','R','YR','Y','YG','G','BG','B','E','C','W','特殊'];
families.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f==='特殊'?'特殊色・その他':f+' 系';$('family').append(o)});

function save(){localStorage.setItem(KEY,JSON.stringify(records));}
function stats(){let n=records.filter(x=>x.bought).length,p=Math.round(n/records.length*100);$('total').textContent=records.length;$('bought').textContent=n;$('remaining').textContent=records.length-n;$('percent').textContent=p+'%';$('bar').style.width=p+'%'}
function render(){stats();let q=$('search').value.trim().toLowerCase(),f=$('family').value;
let arr=records.filter(x=>(filter==='all'||(filter==='todo'&&!x.bought)||(filter==='done'&&x.bought))&&(f==='all'||family(x.code)===f)&&(`${x.code} ${x.name}`).toLowerCase().includes(q));
$('shown').textContent=arr.length+'色';$('list').innerHTML='';
if(!arr.length){$('list').innerHTML='<div class="empty">該当する色はありません</div>';return}
arr.forEach(x=>{const card=document.createElement('article');card.className='color'+(x.bought?' purchased':'');card.innerHTML=`<div class="top"><div class="swatch" style="background:${x.hex}"></div><div style="min-width:0"><div class="code"></div><div class="name"></div></div><input class="check" type="checkbox" aria-label="購入済みにする"></div><div class="meta"><span class="tag"></span><button class="action detailBtn" style="padding:5px 9px">記録</button></div><div class="details"><label>購入日<input type="date" class="date"></label><label>価格（円）<input type="number" min="0" inputmode="numeric" placeholder="例：330" class="price"></label><label>購入店舗<input type="text" maxlength="80" placeholder="店舗名" class="shop"></label><label>メモ<input type="text" maxlength="120" placeholder="セット名など" class="note"></label></div>`;
card.querySelector('.code').textContent=x.code;card.querySelector('.name').textContent=x.name;card.querySelector('.check').checked=x.bought;card.querySelector('.tag').textContent=x.bought?'購入済み':'未購入';
card.querySelector('.check').addEventListener('change',e=>{x.bought=e.target.checked;save();render()});
[['date','date'],['price','price'],['shop','shop'],['note','note']].forEach(([cls,key])=>{let el=card.querySelector('.'+cls);el.value=x[key]||'';el.addEventListener('change',()=>{x[key]=el.value;save()})});
card.querySelector('.detailBtn').addEventListener('click',()=>card.querySelector('.details').classList.toggle('open'));
$('list').append(card)});
}
$('search').addEventListener('input',render);$('family').addEventListener('change',render);
$('filters').addEventListener('click',e=>{let b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='copic-ciao-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error();const map=new Map(data.map(x=>[x.code,x]));records=records.map(x=>({...x,...(map.get(x.code)||{})}));save();render();alert('バックアップを読み込みました');}catch(err){alert('読み込めませんでした。バックアップファイルを確認してください。')}e.target.value=''};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
